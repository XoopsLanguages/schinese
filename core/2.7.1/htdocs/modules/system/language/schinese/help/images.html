<h1 class="head">帮助：图像管理器</h1>
<h4 class="odd">说明</h4>
<p class="even">
        图像管理器是一种工具，使人们能够上传、组织和检索图像以供整个站点使用。您必须先配置图像管理器，然后才能使用它 - 这涉及创建一些类别来存储图像并设置有关最大问题的首选项
        图像尺寸、文件大小和用户组访问权限。每个类别都是单独配置的。<br/><br/>

        图像可以通过此窗口中的浏览器一键分类并直接上传到图像管理器中，从而可以轻松地将图像插入新闻文章和其他内容中。有一个广泛的权限系统控制图像尺寸、文件大小和
        用户组对不同类别的访问。

    </p>
</div>
