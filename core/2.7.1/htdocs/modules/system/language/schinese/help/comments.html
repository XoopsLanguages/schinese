<div class="outer" id="help-template">
<h1 class="head">帮助：评论</h1>
<h4 class="odd">说明</h4>
<p class="even">
        站点管理员可以选择为用户提供评论部分。评论可以添加到许多模块并以多种方式显示。评论可以被筛选、过滤并提供给选定的组。这提供了站点用户快速轻松的交互，同时
        保持良好的节制和安全。<br/><br/>

        评论管理器允许站点管理员编辑和删除已发布到站点的任何评论，这些评论源自支持评论功能的任何模块。
        与“块管理”页面一样，可以使用一些过滤器选项来帮助站点管理员管理评论。 <br/><br/>

        您还可以选择多条评论并一次删除它们。

    </p>
</div>
