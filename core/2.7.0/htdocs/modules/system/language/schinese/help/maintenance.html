<h1 class="head">帮助：维护</h1>
<h4 class="odd">说明</h4>
<p class="even">
        Maintenance 提供了几个基本功能来帮助您维护 XOOPS 安装并保持其健康：<br/><br/>

        - 清理缓存文件夹<br/>
        - 清空会话表<br/>
        - 执行数据库表的维护（分析、检查、优化和修复） <br/><br/>

        您还可以对整个数据库或单个表执行“转储”以进行备份。 </p>
