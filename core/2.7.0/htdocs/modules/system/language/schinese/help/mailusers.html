<h1 class="head">帮助：向用户发送电子邮件</h1>
<h4 class="odd">说明</h4>
<p class="even">
        XOOPS 有一个内置的消息系统，使您能够向整个注册用户群或其子组发送消息，或者使用日期过滤器。这可以是私人消息的形式（即通过 XOOPS 内置消息系统）或通过电子邮件。一系列选项是
        可用于从您的成员资格中过滤掉用户子组。<br/><br/>

        您还可以使用预定义的标签来个性化您的消息。
    </p>
